<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="reports">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <img class="brand-logo" src="/images/jeskin-logo.svg" alt="JESKIN POS logo" />
          <h2>JESKIN POS</h2>
        </div>
        <nav class="nav">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/checkout.html">Checkout</a>
          <a href="/products.html">Products</a>
          <a href="/inventory.html">Inventory</a>
          <a href="/sales.html">Sales History</a>
          <a href="/reports.html" class="active">Reports</a>
          <a href="/users.html">Users</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Reports</h1>
          <div class="topbar-actions">
            <span id="currentUserBadge" class="badge neutral">Loading...</span>
            <button id="logoutBtn" class="logout-btn" type="button" aria-label="Logout" title="Logout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 17l5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </header>

        <section class="panel">
          <form id="reportForm" class="toolbar-row">
            <label>Start date<input type="date" id="startDate" /></label>
            <label>End date<input type="date" id="endDate" /></label>
            <button type="submit" class="primary-btn">Generate</button>
          </form>
        </section>

        <section class="stats-grid compact">
          <article class="stat-card accent">
            <span>Sales</span>
            <strong id="reportSalesCount">0</strong>
          </article>
          <article class="stat-card success">
            <span>Revenue</span>
            <strong id="reportRevenue">GH₵ 0.00</strong>
          </article>
          <article class="stat-card warning">
            <span>Profit</span>
            <strong id="reportProfit">GH₵ 0.00</strong>
          </article>
        </section>

        <section class="panel" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;">
          <div>
            <h3>By Cashier</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Cashier</th>
                    <th>Sales</th>
                    <th>Revenue</th>
                  </tr>
                </thead>
                <tbody id="reportCashierTableBody"></tbody>
              </table>
            </div>
          </div>

          <div>
            <h3>By Status</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Status</th>
                    <th>Sales</th>
                    <th>Revenue</th>
                  </tr>
                </thead>
                <tbody id="reportStatusTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Sale</th>
                  <th>Amount</th>
                  <th>Cashier</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="reportsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
