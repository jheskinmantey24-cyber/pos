<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales History</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="sales">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <img class="brand-logo" src="/images/jeskin-logo.svg" alt="JESKIN POS logo" />
          <h2>JESKIN POS</h2>
        </div>
        <nav class="nav">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/checkout.html">Checkout</a>
          <a href="/products.html">Products</a>
          <a href="/inventory.html">Inventory</a>
          <a href="/sales.html" class="active">Sales History</a>
          <a href="/reports.html">Reports</a>
          <a href="/users.html">Users</a>
          <button id="logoutBtn" class="link-btn danger">Logout</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Sales History</h1>
          <span id="currentUserBadge" class="badge neutral">Loading...</span>
        </header>

        <div id="salesNotice" class="form-message hidden"></div>

        <section class="panel">
          <form id="salesFilterForm" class="toolbar-row">
            <label>
              Status
              <select id="salesStatusFilter">
                <option value="">All</option>
                <option value="completed">Completed</option>
                <option value="refunded">Refunded</option>
                <option value="partial_refund">Partial refund</option>
              </select>
            </label>

            <label>
              Start date
              <input id="salesStartDate" type="date" />
            </label>

            <label>
              End date
              <input id="salesEndDate" type="date" />
            </label>

            <button type="submit" class="primary-btn">Apply</button>
            <button type="button" id="salesResetFiltersBtn" class="secondary-btn">Reset</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Invoice</th>
                  <th>Cashier</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th>Time</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="salesTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="refundModal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="refundModalTitle">
        <div class="modal-header">
          <h3 id="refundModalTitle">Process refund</h3>
          <button id="refundCloseBtn" type="button" class="link-btn" aria-label="Close refund form">Close</button>
        </div>

        <form id="refundForm" class="stack-form">
          <input id="refundSaleId" type="hidden" />

          <label>
            Refund amount
            <input id="refundAmount" name="amount" type="number" min="0" step="0.01" required />
          </label>

          <label>
            Reason
            <input id="refundReason" name="reason" type="text" value="customer_return" maxlength="150" />
          </label>

          <div class="modal-actions">
            <button type="button" id="refundCancelBtn" class="secondary-btn">Cancel</button>
            <button type="submit" class="primary-btn">Confirm refund</button>
          </div>
        </form>
      </div>
    </div>

    <div id="saleDetailModal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="saleDetailTitle">
        <div class="modal-header">
          <h3 id="saleDetailTitle">Sale details</h3>
          <button id="saleDetailCloseBtn" type="button" class="link-btn" aria-label="Close sale details">Close</button>
        </div>

        <div id="saleDetailBody" class="stack-form"></div>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
