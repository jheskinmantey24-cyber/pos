<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JESKIN POS Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand-block">
          <img class="brand-logo" src="/images/jeskin-logo.svg" alt="JESKIN POS logo" />
          <h1>JESKIN POS</h1>
          <p>Retail operations & sales control</p>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            Email
            <input type="email" id="email" name="email" value="admin@ghpos.local" required />
          </label>
          <label>
            Password
            <input type="password" id="password" name="password" placeholder="Enter password" required />
          </label>
          <button type="submit" class="primary-btn">Login</button>
          <div id="loginError" class="form-message error hidden"></div>
        </form>
      </div>
    </div>
    <script src="/js/app.js"></script>
  </body>
</html>
