<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="products">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <img class="brand-logo" src="/images/jeskin-logo.svg" alt="JESKIN POS logo" />
          <h2>JESKIN POS</h2>
        </div>
        <nav class="nav">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/checkout.html">Checkout</a>
          <a href="/products.html" class="active">Products</a>
          <a href="/inventory.html">Inventory</a>
          <a href="/sales.html">Sales History</a>
          <a href="/reports.html">Reports</a>
          <a href="/users.html">Users</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Products</h1>
          <div class="topbar-actions">
            <span id="currentUserBadge" class="badge neutral">Loading...</span>
            <button id="logoutBtn" class="logout-btn" type="button" aria-label="Logout" title="Logout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 17l5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </header>

        <section class="panel">
          <div class="toolbar-row">
            <input id="searchInput" type="search" placeholder="Search by name or barcode" />
            <select id="categoryFilter" aria-label="Filter by category">
              <option value="">All categories</option>
            </select>
            <button id="refreshProductsBtn" class="secondary-btn">Refresh</button>
          </div>

          <form id="productForm" class="stack-form">
            <input type="hidden" id="productId" />
            <div class="form-grid">
              <label>Category
                <select id="categoryId"></select>
              </label>
              <label>Name
                <input id="productName" type="text" required />
              </label>
              <label>Barcode
                <input id="productBarcode" type="text" placeholder="Scanned or blank = auto" />
              </label>
              <label>Price
                <input id="productPrice" type="number" min="0" step="0.01" required />
              </label>
            </div>
            <div class="action-row">
              <button type="submit" class="primary-btn">Save Product</button>
              <button type="button" id="resetProductBtn" class="secondary-btn">Clear</button>
            </div>
            <details class="more-options">
              <summary>More options</summary>
              <div class="form-grid">
                <label>New category
                  <input id="newCategoryName" type="text" placeholder="Add a new category" />
                </label>
                <button type="button" id="newCategoryBtn" class="secondary-btn">Create category</button>
                <label>Cost Price
                  <input id="productCostPrice" type="number" min="0" step="0.01" placeholder="Defaults to price" />
                </label>
                <label>Stock
                  <input id="productStock" type="number" min="0" step="1" placeholder="0" />
                </label>
                <label>Low-stock threshold
                  <input id="productThreshold" type="number" min="0" step="1" value="5" />
                </label>
                <label>Active
                  <select id="productIsActive">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                  </select>
                </label>
              </div>
            </details>
            <div id="productError" class="form-message error hidden"></div>
          </form>
        </section>

        <section class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Barcode</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
