<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="inventory">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <img class="brand-logo" src="/images/jeskin-logo.svg" alt="JESKIN POS logo" />
          <h2>JESKIN POS</h2>
        </div>
        <nav class="nav">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/checkout.html">Checkout</a>
          <a href="/products.html">Products</a>
          <a href="/inventory.html" class="active">Inventory</a>
          <a href="/sales.html">Sales History</a>
          <a href="/reports.html">Reports</a>
          <a href="/users.html">Users</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Inventory</h1>
          <div class="topbar-actions">
            <span id="currentUserBadge" class="badge neutral">Loading...</span>
            <button id="logoutBtn" class="logout-btn" type="button" aria-label="Logout" title="Logout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 17l5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </header>

        <section class="panel">
          <form id="stockAdjustmentForm" class="stack-form">
            <div class="form-grid">
              <label>Product
                <select id="stockProductId"></select>
              </label>
              <label>Quantity change
                <input id="stockChange" type="number" step="1" value="0" required />
              </label>
              <label>Reason
                <select id="stockReason">
                  <option value="restock">Restock</option>
                  <option value="damage">Damage</option>
                  <option value="sale">Sale</option>
                  <option value="manual_adjustment">Manual adjustment</option>
                </select>
              </label>
              <label>Notes
                <input id="stockNotes" type="text" placeholder="Optional notes" />
              </label>
            </div>
            <button type="submit" class="primary-btn">Save Adjustment</button>
            <div id="inventoryError" class="form-message error hidden"></div>
          </form>
        </section>

        <section class="panel">
          <h3>Low stock items</h3>
          <div id="lowStockInventoryList" class="list-box"></div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
